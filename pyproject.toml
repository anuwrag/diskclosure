[project]
name = "diskclosure"
version = "0.1.0"
description = "Find what's using disk space on your Mac"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["macos", "disk", "tui", "disk-usage"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]
dependencies = ["textual>=2"]

[project.scripts]
diskclosure = "diskclosure.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diskclosure*"]
